[project]
name = "personal-web"
version = "0.1.0"
description = "Personal portfolio web app built with Flet"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "flet>=0.84.0",
]

[tool.uv]
package = false

[tool.flet.web]
base_url = "/personal_web/"
route_url_strategy = "hash"
cdn = false

[tool.flet.boot_screen]
name = "flet"

[tool.flet.boot_screen.flet]
theme_mode = "light"
bgcolor_light = "#fbfbfb"
spinner_color_light = "#ff7a00"
spinner_size = 34
text_color_light = "#143a6d"
startup_message = "Loading portfolio..."
fade_out_duration = 180
