[project]
name = "personal-web"
version = "0.1.0"
description = "Personal portfolio web app built with Flet"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "flet>=0.84.0",
]

[tool.uv]
package = false

[tool.flet.web]
base_url = "/personal_web/"
route_url_strategy = "hash"
